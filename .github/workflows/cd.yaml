name: CD - wormless
on:
  push:
    branches: [production]

env:
  JAVA_VERSION: 21
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/wormless

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false 

jobs:
  publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name }}
    outputs:
      image_tag: ${{ steps.tags.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Package application
        run: mvn package -DskipTests

      - name: Define image tags
        id: tags
        run: |
          SHA_TAG=${{ env.IMAGE_NAME }}:${{ github.sha }}
          if [ "${{ github.ref_name }}" = "production" ]; then
            MOVING_TAG=${{ env.IMAGE_NAME }}:latest
          else
            MOVING_TAG=${{ env.IMAGE_NAME }}:staging
          fi
          echo "tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_ENV"
          echo "moving_tag=$MOVING_TAG" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.sha_tag }}
            ${{ env.moving_tag }}

  security-scan:
    name: Dependency & image vulnerability scan
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check
        continue-on-error: true # informativo, nao bloqueia

      - name: Upload Scan Report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          # Escaneia pela tag do SHA (imutavel), nao "latest"
          image-ref: ${{ needs.publish.outputs.image_tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # informativo por ora

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

