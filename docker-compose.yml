services:
  mysql:
    image: mysql:8.4
    container_name: wormless-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wormless
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: wormless
      MYSQL_PASSWORD: wormless
    ports:
      - "3306:3306"
    volumes:
      - wormless-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: wormless-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: wormless
      DB_USER: wormless
      DB_PASSWORD: wormless
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      SANDBOX_URL: http://localhost:8081
      FRONTEND_ORIGIN: http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8080:8080"

volumes:
  wormless-mysql-data:
