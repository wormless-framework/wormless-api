# ---------- Aplicação ----------
spring.application.name=wormless
sandbox.url=${SANDBOX_URL:http://localhost:8081}

# ---------- Banco de dados (MySQL) ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wormless}?useSSL=false&\
allowPublicKeyRetrieval=true&\
serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Servidor ----------
server.port=${SERVER_PORT:8080}

# ---------- Upload de arquivos ----------
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ---------- Integração Gemini ----------
gemini.api.url=https://generativelanguage.googleapis.com
gemini.api.key=${GEMINI_API_KEY}
gemini.models=gemini-3.5-flash,gemini-3.5-flash-lite

# Tempo para conseguir ligar à Google (15 segundos)
spring.cloud.openfeign.client.config.default.connect-timeout=15000
# Tempo para esperar pela resposta da IA (120 segundos)
spring.cloud.openfeign.client.config.default.read-timeout=120000